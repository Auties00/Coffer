# Regenerates the jextract bindings on the systems whose headers they come from (the Windows and macOS backends, and
# the libc calls of the D-Bus abstract-socket transport on Linux), and commits them to the branch it runs on. Started
# by hand after a change to bindings/.
name: Bindings

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bindings-${{ github.ref }}

defaults:
  run:
    shell: bash

env:
  JEXTRACT: https://download.java.net/java/early_access/jextract/25/2/openjdk-25-jextract+2-4

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Puts the Windows SDK headers on INCLUDE, where jextract's clang looks for them
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Download jextract
        run: |
          curl -fsSL -o jextract.tar.gz "${JEXTRACT}_windows-x64_bin.tar.gz"
          mkdir jextract
          tar -xzf jextract.tar.gz -C jextract --strip-components=1
          ls jextract/bin

      - name: Generate
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force src/main/java/com/github/auties00/coffer/backend/windows/ffm -ErrorAction SilentlyContinue
          $launcher = Get-ChildItem jextract/bin | Where-Object { $_.BaseName -eq 'jextract' -and $_.Extension -in '.bat', '.cmd', '.exe' } | Select-Object -First 1
          & $launcher.FullName "@bindings/windows.args" bindings/windows.h
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check every symbol was generated
        run: bash bindings/check.sh bindings/windows.args src/main/java/com/github/auties00/coffer/backend/windows/ffm "$(ls jextract/bin/jextract.bat jextract/bin/jextract.cmd jextract/bin/jextract.exe 2>/dev/null | head -n 1)" bindings/windows.h

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bindings
          path: src/main/java/com/github/auties00/coffer/backend/windows/ffm
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download jextract
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x64)
          curl -fsSL -o jextract.tar.gz "${JEXTRACT}_macos-${arch}_bin.tar.gz"
          mkdir jextract
          tar -xzf jextract.tar.gz -C jextract --strip-components=1
          # The download is not notarized
          xattr -dr com.apple.quarantine jextract || true

      - name: Generate
        run: |
          rm -rf src/main/java/com/github/auties00/coffer/backend/macos/ffm
          jextract/bin/jextract @bindings/macos.args bindings/macos.h

      - name: Diagnose the keychain interaction functions
        if: always()
        run: |
          sdk=$(xcrun --show-sdk-path)
          echo "== TargetConditionals.h"
          grep -n "define_target_os_macros\|DYNAMIC_TARGETS_ENABLED\|define TARGET_OS_OSX\|__APPLE_CC__\|__is_target_os(macos" "$sdk/usr/include/TargetConditionals.h" | head -30
          echo "== Security.h around SecKeychain.h"
          awk 'NR>=40 && NR<=80' "$sdk/System/Library/Frameworks/Security.framework/Headers/Security.h" | grep -n "#if\|#else\|#endif\|SecKeychain.h" || true
          cat > probe.h <<'EOF'
          #include <Security/Security.h>
          #ifdef __APPLE_CC__
          #define PROBE_APPLE_CC __APPLE_CC__
          #endif
          #ifdef __aarch64__
          #define PROBE_AARCH64 1
          #endif
          #ifdef __x86_64__
          #define PROBE_X86_64 1
          #endif
          #define PROBE_TARGET_OS_MAC TARGET_OS_MAC
          #define PROBE_TARGET_OS_OSX TARGET_OS_OSX
          #define PROBE_TARGET_OS_IPHONE TARGET_OS_IPHONE
          #define PROBE_DYNAMIC DYNAMIC_TARGETS_ENABLED
          #define PROBE_SEC_OS_OSX SEC_OS_OSX
          #define PROBE_SEC_OS_OSX_INCLUDES SEC_OS_OSX_INCLUDES
          EOF
          sed -i '' 's/^          //' probe.h
          args=()
          for name in PROBE_APPLE_CC PROBE_AARCH64 PROBE_X86_64 PROBE_TARGET_OS_MAC PROBE_TARGET_OS_OSX PROBE_TARGET_OS_IPHONE PROBE_DYNAMIC PROBE_SEC_OS_OSX PROBE_SEC_OS_OSX_INCLUDES; do
            args+=(--include-constant "$name")
          done
          jextract/bin/jextract --output probe "${args[@]}" probe.h > probe.log 2>&1 || cat probe.log
          echo "== what jextract's clang computes"
          grep -rhE "static final [a-z]+ PROBE_[A-Z_0-9]+ = " probe || echo "no probe constants generated"
          jextract/bin/jextract --version || true

      - name: Check every symbol was generated
        run: bash bindings/check.sh bindings/macos.args src/main/java/com/github/auties00/coffer/backend/macos/ffm jextract/bin/jextract bindings/macos.h

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bindings
          path: src/main/java/com/github/auties00/coffer/backend/macos/ffm
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download jextract
        run: |
          curl -fsSL -o jextract.tar.gz "${JEXTRACT}_linux-x64_bin.tar.gz"
          mkdir jextract
          tar -xzf jextract.tar.gz -C jextract --strip-components=1

      - name: Generate
        run: |
          rm -rf src/main/java/com/github/auties00/coffer/backend/dbus/ffm
          jextract/bin/jextract @bindings/linux.args bindings/linux.h

      - name: Check every symbol was generated
        run: bash bindings/check.sh bindings/linux.args src/main/java/com/github/auties00/coffer/backend/dbus/ffm jextract/bin/jextract bindings/linux.h

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bindings
          path: src/main/java/com/github/auties00/coffer/backend/dbus/ffm
          if-no-files-found: error

  commit:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Remove the old bindings
        run: rm -rf src/main/java/com/github/auties00/coffer/backend/windows/ffm src/main/java/com/github/auties00/coffer/backend/macos/ffm src/main/java/com/github/auties00/coffer/backend/dbus/ffm

      - uses: actions/download-artifact@v4
        with:
          name: windows-bindings
          path: src/main/java/com/github/auties00/coffer/backend/windows/ffm

      - uses: actions/download-artifact@v4
        with:
          name: macos-bindings
          path: src/main/java/com/github/auties00/coffer/backend/macos/ffm

      - uses: actions/download-artifact@v4
        with:
          name: linux-bindings
          path: src/main/java/com/github/auties00/coffer/backend/dbus/ffm

      - name: Commit
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/java/com/github/auties00/coffer/backend/windows/ffm src/main/java/com/github/auties00/coffer/backend/macos/ffm src/main/java/com/github/auties00/coffer/backend/dbus/ffm
          if git diff --cached --quiet; then
            echo "The bindings did not change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Regenerate the jextract bindings"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push with the workflow's token starts no workflow, so CI is started by hand
      - name: Test the new bindings
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
