# Pushes and pull requests: the whole test suite on each system, against its real keyring.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test on ${{ matrix.os }}${{ matrix.bus == 'abstract' && ', abstract bus' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bus: [path]
        include:
          # A session bus on a Linux abstract socket only, as distributions without systemd's user bus start it
          - os: ubuntu-latest
            bus: abstract
    env:
      # The keyring tests fail, rather than skip, when the system's keyring cannot be reached
      COFFER_REQUIRE_KEYRING: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # A session bus, on a socket path or an abstract socket, and GNOME Keyring on it with an unlocked login
      # collection
      - name: Start a session bus and a keyring
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnome-keyring dbus > /dev/null
          if [ '${{ matrix.bus }}' = abstract ]; then
            listen="unix:abstract=coffer-ci-$GITHUB_RUN_ID"
          else
            listen="unix:path=$RUNNER_TEMP/session-bus"
          fi
          address=$(dbus-daemon --session --address="$listen" --fork --print-address | head -n 1)
          echo "Session bus at $address"
          echo "DBUS_SESSION_BUS_ADDRESS=$address" >> "$GITHUB_ENV"
          if [ '${{ matrix.bus }}' = abstract ]; then
            echo "COFFER_TEST_ABSTRACT_BUS=$address" >> "$GITHUB_ENV"
          fi
          export DBUS_SESSION_BUS_ADDRESS="$address"
          printf 'coffer' | gnome-keyring-daemon --unlock --components=secrets

      # A default keychain that never locks, so the tests never meet a password dialog
      - name: Create a keychain
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p coffer coffer.keychain
          security list-keychains -d user -s coffer.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s coffer.keychain
          security unlock-keychain -p coffer coffer.keychain
          security set-keychain-settings coffer.keychain

      - name: Test
        run: mvn -B -ntp verify

      # Last, since it leaves the keyring locked
      - name: Test a locked keyring
        if: runner.os != 'Windows'
        env:
          COFFER_TEST_LOCK: 'true'
        run: mvn -B -ntp surefire:test -Dtest=LockedKeyringTest

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-${{ matrix.bus }}
          path: target/surefire-reports/
          retention-days: 14

  freebsd:
    name: test on FreeBSD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # FreeBSD's newest JDK, which compiles and runs the Java 26 release; the session bus on a socket path, since
      # abstract sockets are Linux only
      - name: Test in a FreeBSD virtual machine
        uses: vmactions/freebsd-vm@v1
        with:
          release: '15'
          copyback: true
          prepare: |
            pkg install -y openjdk27 maven dbus gnome-keyring
            dbus-uuidgen --ensure
          run: |
            set -e
            export JAVA_HOME=/usr/local/openjdk27
            export PATH="$JAVA_HOME/bin:$PATH"
            export COFFER_REQUIRE_KEYRING=true
            freebsd-version
            java -version
            address=$(dbus-daemon --session --address="unix:path=/tmp/coffer-session-bus" --fork --print-address | head -n 1)
            echo "Session bus at $address"
            export DBUS_SESSION_BUS_ADDRESS="$address"
            printf 'coffer' | gnome-keyring-daemon --unlock --components=secrets
            mvn -B -ntp verify
            COFFER_TEST_LOCK=true mvn -B -ntp surefire:test -Dtest=LockedKeyringTest

      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-freebsd
          path: target/surefire-reports/
          retention-days: 14
